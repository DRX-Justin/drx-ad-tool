<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DRX 達特世 廣告素材產生器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0b14;color:#e0e0e8;font-family:'Noto Sans TC',sans-serif;overflow:hidden;height:100vh}
.header{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;justify-content:space-between;align-items:center;height:50px;flex-shrink:0}
.app{display:flex;height:calc(100vh - 50px)}
.sidebar{width:380px;flex-shrink:0;background:#12121e;border-right:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;height:100%}
.sidebar-tabs{display:flex;border-bottom:1px solid rgba(255,255,255,0.05);flex-shrink:0}
.sidebar-tabs button{flex:1;padding:10px 2px;background:none;border:none;color:#555;font-size:11px;font-weight:600;cursor:pointer;font-family:'Noto Sans TC',sans-serif;border-bottom:2px solid transparent}
.sidebar-tabs button.active{color:#9AB2C0;border-bottom-color:#9AB2C0}
.sidebar-content{padding:14px 16px;overflow-y:auto;flex:1}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px;overflow:auto;background:#0b0b14}
.canvas-wrap{position:relative;cursor:default;overflow:hidden;border-radius:8px;box-shadow:0 4px 30px rgba(0,0,0,0.5)}
.canvas-wrap img.bg-photo{position:absolute;top:0;left:0;cursor:move;user-select:none;-webkit-user-select:none}
.elem{position:absolute;cursor:move;user-select:none;-webkit-user-select:none;padding:4px;border:2px solid transparent;transition:border-color 0.15s}
.elem:hover,.elem.selected{border-color:rgba(154,178,192,0.5)}
.elem.selected{border-color:#9AB2C0}
.resize-handle{position:absolute;bottom:-6px;right:-6px;width:12px;height:12px;background:#9AB2C0;border-radius:50%;cursor:nwse-resize;display:none}
.elem.selected .resize-handle{display:block}
.inp{width:100%;padding:8px 12px;border-radius:6px;border:none;background:rgba(255,255,255,0.06);color:#e0e0e8;font-size:13px;outline:1px solid rgba(255,255,255,0.08);font-family:'Noto Sans TC',sans-serif;margin-bottom:6px}
.inp:focus{outline-color:rgba(154,178,192,0.3)}
.hex-inp{padding:4px 6px;border-radius:4px;border:none;background:rgba(255,255,255,0.06);color:#e0e0e8;font-size:11px;outline:1px solid rgba(255,255,255,0.08);font-family:monospace;width:80px;text-transform:uppercase}
.hex-inp:focus{outline-color:rgba(154,178,192,0.3)}
.color-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.color-row label{font-size:10px;color:#888;width:48px;flex-shrink:0}
.sec{margin-bottom:14px}
.sec-t{font-size:10px;font-weight:700;color:#7a7a90;margin-bottom:6px;letter-spacing:1px}
.row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.chip{padding:4px 10px;border-radius:5px;border:none;background:rgba(255,255,255,0.05);color:#888;cursor:pointer;font-size:11px;font-family:'Noto Sans TC',sans-serif}
.chip:hover{background:rgba(154,178,192,0.15);color:#9AB2C0}
.btn{padding:8px 12px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:'Noto Sans TC',sans-serif}
.btn-p{background:linear-gradient(135deg,#9AB2C0,#7a9aaa);color:#fff}
.btn-p:disabled{background:rgba(154,178,192,0.1);color:#666;cursor:wait}
.btn-s{background:rgba(255,255,255,0.05);color:#9AB2C0;border:1px solid rgba(154,178,192,0.2)}
.slider-r{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.slider-r label{font-size:10px;color:#888;width:50px;flex-shrink:0}
.slider-r input[type=range]{flex:1;accent-color:#9AB2C0;height:16px}
.slider-r .v{font-size:10px;color:#9AB2C0;width:36px;text-align:right}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.toggle-row span{font-size:12px;color:#bbb}
.toggle{width:36px;height:20px;border-radius:10px;background:rgba(255,255,255,0.1);cursor:pointer;position:relative;transition:background 0.2s}
.toggle.on{background:#9AB2C0}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left 0.2s}
.toggle.on::after{left:18px}
.del-btn{position:absolute;top:-8px;right:-8px;width:18px;height:18px;border-radius:50%;background:#e74c3c;color:#fff;font-size:10px;border:none;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1;z-index:10}
.elem.selected .del-btn{display:flex}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;background:#22c55e;color:#fff;padding:7px 22px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:opacity 0.3s;pointer-events:none}
.toast.show{opacity:1}
.color-dot{width:32px;height:32px;border-radius:8px;border:none;cursor:pointer;outline-offset:2px}
.size-opt{padding:8px;border-radius:8px;border:none;font-size:11px;font-weight:600;cursor:pointer;text-align:center;flex:1}
.upload-zone{border:2px dashed rgba(154,178,192,0.2);border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:border-color 0.2s}
.upload-zone:hover{border-color:rgba(154,178,192,0.4)}
.aud-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.aud-l{width:60px;flex-shrink:0;font-size:10px;font-weight:700;color:#9AB2C0;padding-top:2px}
.aud-v{font-size:12px;color:#bbb;line-height:1.5}
.copy-card{background:rgba(255,255,255,0.04);padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);cursor:pointer;font-size:12px;line-height:1.7;white-space:pre-line;color:#ccc;margin-bottom:12px}
.copy-card:hover{border-color:rgba(154,178,192,0.3)}
.tpl-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:10px 12px;cursor:pointer;transition:all 0.15s;margin-bottom:6px}
.tpl-card:hover{border-color:rgba(154,178,192,0.4);background:rgba(154,178,192,0.05)}
.tpl-card .tpl-l{font-size:12px;font-weight:700;color:#9AB2C0;margin-bottom:2px}
.tpl-card .tpl-d{font-size:10px;color:#777}
@media (max-width:900px){
  body{overflow:auto;height:auto}
  .app{flex-direction:column;height:auto}
  .sidebar{width:100%;height:auto;max-height:55vh;border-right:none;border-top:1px solid rgba(255,255,255,0.08);order:2}
  .main{padding:12px;order:1}
}
</style>
</head>

function HexInput({value,onChange,placeholder}){
  const[txt,setTxt]=React.useState(value||"");
  const[editing,setEditing]=React.useState(false);
  React.useEffect(()=>{if(!editing)setTxt((value||"").toUpperCase())},[value,editing]);
  return React.createElement("input",{type:"text",className:"hex-inp",value:txt,placeholder:placeholder||"#9AB2C0",maxLength:7,
    onFocus:()=>setEditing(true),
    onChange:e=>{
      let v=e.target.value;setTxt(v);
      // Only propagate on full valid 6-digit hex (don't auto-expand 3-digit while typing)
      let n=v.trim();
      if(!n)return;
      if(n[0]!=="#")n="#"+n;
      if(/^#[0-9a-fA-F]{6}$/.test(n))onChange(n);
    },
    onBlur:e=>{
      setEditing(false);
      let v=e.target.value.trim();
      if(!v){setTxt((value||"").toUpperCase());return}
      if(v[0]!=="#")v="#"+v;
      if(/^#[0-9a-fA-F]{6}$/.test(v)){onChange(v);setTxt(v.toUpperCase())}
      else if(/^#[0-9a-fA-F]{3}$/.test(v)){const f="#"+v[1]+v[1]+v[2]+v[2]+v[3]+v[3];onChange(f);setTxt(f.toUpperCase())}
      else setTxt((value||"").toUpperCase());
    },
    onKeyDown:e=>{if(e.key==="Enter")e.target.blur()}})
}
